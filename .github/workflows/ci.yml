name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/evolve.test.mjs
      - run: node scripts/dsh-evolve.mjs help

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --test test/plugin.test.mjs
      - run: pnpm pack
      - run: node scripts/runtime-smoke.mjs ./dsh-rule-evolve-0.7.0.tgz
